AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Phase 05 (Containers) - ECS Fargate cluster, task definition, and service.
  0.25 vCPU / 0.5GB, desired count 1, no auto scaling - a demo workload, not
  a load target. Reference implementation only, mirrors the
  Terraform-managed live infrastructure. Never deployed.

Parameters:
  ProjectName:
    Type: String
    Default: aws-portfolio-05-containers
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
  EcsTaskSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: From network.yaml Outputs
  TargetGroupArn:
    Type: String
    Description: From alb.yaml Outputs
  EcrRepositoryUrl:
    Type: String
    Description: From ecr.yaml Outputs
  ImageTag:
    Type: String
    Default: latest
  ContainerPort:
    Type: Number
    Default: 8000
  DbEndpoint:
    Type: String
    Description: From rds.yaml Outputs (Endpoint)
  DbName:
    Type: String
    Default: portfolio05
  DbUsername:
    Type: String
    Default: portfolio05admin
  DbPassword:
    Type: String
    NoEcho: true

Resources:
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Ref ProjectName
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ecs/${ProjectName}"
      RetentionInDays: 14

  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-task-execution"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-task"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      # DB接続情報はTerraform版と同様、環境変数として注入するため
      # 実行時にAWS APIを呼ぶ必要がない。空のロールとして用意する
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Ref ProjectName
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: "256"
      Memory: "512"
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: app
          Image: !Sub "${EcrRepositoryUrl}:${ImageTag}"
          Essential: true
          PortMappings:
            - ContainerPort: !Ref ContainerPort
              Protocol: tcp
          Environment:
            - Name: DB_HOST
              Value: !Ref DbEndpoint
            - Name: DB_PORT
              Value: "5432"
            - Name: DB_NAME
              Value: !Ref DbName
            - Name: DB_USER
              Value: !Ref DbUsername
            - Name: DB_PASSWORD
              Value: !Ref DbPassword
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: app
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  Service:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: !Ref ProjectName
      Cluster: !Ref Cluster
      TaskDefinition: !Ref TaskDefinition
      DesiredCount: 1
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          Subnets: !Ref SubnetIds
          SecurityGroups:
            - !Ref EcsTaskSecurityGroupId
          AssignPublicIp: ENABLED
      LoadBalancers:
        - ContainerName: app
          ContainerPort: !Ref ContainerPort
          TargetGroupArn: !Ref TargetGroupArn
      Tags:
        - Key: Project
          Value: !Ref ProjectName

Outputs:
  ClusterName:
    Value: !Ref Cluster
  ServiceName:
    Value: !GetAtt Service.Name
