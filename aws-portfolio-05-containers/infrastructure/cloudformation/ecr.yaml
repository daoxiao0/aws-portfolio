AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Phase 05 (Containers) - ECR repository. Reference implementation only,
  mirrors the Terraform-managed live infrastructure. Never deployed.

Parameters:
  ProjectName:
    Type: String
    Default: aws-portfolio-05-containers

Resources:
  Repository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Ref ProjectName
      ImageTagMutability: MUTABLE
      # RepositoryPolicy is separate from the deletion behavior. CloudFormation
      # deletes a non-empty ECR repo by default only if EmptyOnDelete is set -
      # the Terraform equivalent of force_delete.
      EmptyOnDelete: true
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: >
          {"rules":[{"rulePriority":1,"description":"Keep only the last 10 images",
          "selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":10},
          "action":{"type":"expire"}}]}
      Tags:
        - Key: Project
          Value: !Ref ProjectName

Outputs:
  RepositoryUrl:
    Value: !GetAtt Repository.RepositoryUri
  RepositoryArn:
    Value: !GetAtt Repository.Arn
