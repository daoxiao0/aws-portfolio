AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Phase 06 (Enterprise DevOps) - S3 bucket for CodePipeline artifacts
  (Source/Build handoff). Reference implementation only, mirrors the
  Terraform-managed live infrastructure. Never deployed.

Parameters:
  ProjectName:
    Type: String
    Default: aws-portfolio-06-devops

Resources:
  ArtifactBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BucketName: !Sub "${ProjectName}-artifacts-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName

Outputs:
  BucketName:
    Value: !Ref ArtifactBucket
  BucketArn:
    Value: !GetAtt ArtifactBucket.Arn
