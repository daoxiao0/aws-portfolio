AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Phase 06 (Enterprise DevOps) - CodePipeline: Source (GitHub via
  CodeConnections) -> Build (CodeBuild) -> Approve (manual gate) -> Deploy
  (native ECS deploy action against Phase 05's service). No automatic
  trigger is configured on purpose - see docs/Architecture.md: Phase 05's
  existing GitHub Actions workflow already auto-deploys on app changes,
  so this pipeline is a deliberately separate, manually-started
  implementation of the same job, not a competing auto-trigger. Reference
  implementation only, mirrors the Terraform-managed live infrastructure.
  Never deployed.

Parameters:
  ProjectName:
    Type: String
    Default: aws-portfolio-06-devops
  Phase5ProjectName:
    Type: String
    Default: aws-portfolio-05-containers
  ArtifactBucketName:
    Type: String
    Description: From s3-artifacts.yaml Outputs
  ArtifactBucketArn:
    Type: String
    Description: From s3-artifacts.yaml Outputs
  ConnectionArn:
    Type: String
    Description: From codeconnections.yaml Outputs (must be AVAILABLE, not PENDING)
  GithubOwner:
    Type: String
    Default: daoxiao0
  GithubRepo:
    Type: String
    Default: aws-portfolio
  GithubBranch:
    Type: String
    Default: main
  CodeBuildProjectName:
    Type: String
    Description: From codebuild.yaml Outputs
  CodeBuildProjectArn:
    Type: String
    Description: From codebuild.yaml Outputs (constructed as arn:aws:codebuild:<region>:<account>:project/<name> if not exported directly)

Resources:
  CodePipelineRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-codepipeline"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codepipeline.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: !Sub "${ProjectName}-codepipeline"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ArtifactBucket
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:GetBucketVersioning
                  - s3:GetBucketLocation
                Resource:
                  - !Ref ArtifactBucketArn
                  - !Sub "${ArtifactBucketArn}/*"
              - Sid: UseGithubConnection
                Effect: Allow
                Action: codestar-connections:UseConnection
                Resource: !Ref ConnectionArn
              - Sid: RunCodeBuild
                Effect: Allow
                Action:
                  - codebuild:StartBuild
                  - codebuild:BatchGetBuilds
                Resource: !Ref CodeBuildProjectArn
              - Sid: EcsDeploy
                Effect: Allow
                Action:
                  - ecs:DescribeServices
                  - ecs:DescribeTaskDefinition
                  - ecs:DescribeTasks
                  - ecs:ListTasks
                  - ecs:RegisterTaskDefinition
                  - ecs:UpdateService
                # describe/register系の多くはリソースレベル権限に非対応（AWS仕様）
                Resource: "*"
              - Sid: PassPhase5TaskRoles
                Effect: Allow
                Action: iam:PassRole
                Resource:
                  - !Sub "arn:aws:iam::${AWS::AccountId}:role/${Phase5ProjectName}-task"
                  - !Sub "arn:aws:iam::${AWS::AccountId}:role/${Phase5ProjectName}-task-execution"
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  Pipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      Name: !Ref ProjectName
      RoleArn: !GetAtt CodePipelineRole.Arn
      PipelineType: V2
      ArtifactStore:
        Type: S3
        Location: !Ref ArtifactBucketName
      Stages:
        - Name: Source
          Actions:
            - Name: Source
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: CodeStarSourceConnection
                Version: "1"
              OutputArtifacts:
                - Name: source_output
              Configuration:
                ConnectionArn: !Ref ConnectionArn
                FullRepositoryId: !Sub "${GithubOwner}/${GithubRepo}"
                BranchName: !Ref GithubBranch
        - Name: Build
          Actions:
            - Name: Build
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: "1"
              InputArtifacts:
                - Name: source_output
              OutputArtifacts:
                - Name: build_output
              Configuration:
                ProjectName: !Ref CodeBuildProjectName
        - Name: Approve
          Actions:
            - Name: ManualApproval
              ActionTypeId:
                Category: Approval
                Owner: AWS
                Provider: Manual
                Version: "1"
              Configuration:
                CustomData: "Review the new image pushed to ECR, then approve to deploy it to the Phase 5 ECS service."
        - Name: Deploy
          Actions:
            - Name: Deploy
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Provider: ECS
                Version: "1"
              InputArtifacts:
                - Name: build_output
              Configuration:
                ClusterName: !Ref Phase5ProjectName
                ServiceName: !Ref Phase5ProjectName
                FileName: imagedefinitions.json
      Tags:
        - Key: Project
          Value: !Ref ProjectName

Outputs:
  PipelineName:
    Value: !Ref Pipeline
