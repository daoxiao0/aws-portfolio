AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Phase 06 (Enterprise DevOps) - CodePipeline: Source (GitHub via
  CodeConnections) -> Build (CodeBuild) -> Approve (manual gate) -> Deploy
  (native ECS deploy action against Phase 05's service). No automatic
  trigger is configured on purpose - see docs/Architecture.md: Phase 05's
  existing GitHub Actions workflow already auto-deploys on app changes,
  so this pipeline is a deliberately separate, manually-started
  implementation of the same job, not a competing auto-trigger. Reference
  implementation only, mirrors the Terraform-managed live infrastructure.
  Never deployed.

Parameters:
  ProjectName:
    Type: String
    Default: aws-portfolio-06-devops
  Phase5ProjectName:
    Type: String
    Default: aws-portfolio-05-containers
  ArtifactBucketName:
    Type: String
    Description: From s3-artifacts.yaml Outputs
  ArtifactBucketArn:
    Type: String
    Description: From s3-artifacts.yaml Outputs
  ConnectionArn:
    Type: String
    Description: From codeconnections.yaml Outputs (must be AVAILABLE, not PENDING)
  GithubOwner:
    Type: String
    Default: daoxiao0
  GithubRepo:
    Type: String
    Default: aws-portfolio
  GithubBranch:
    Type: String
    Default: main
  CodeBuildProjectName:
    Type: String
    Description: From codebuild.yaml Outputs
  CodeBuildProjectArn:
    Type: String
    Description: From codebuild.yaml Outputs (constructed as arn:aws:codebuild:<region>:<account>:project/<name> if not exported directly)

Resources:
  CodePipelineRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-codepipeline"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codepipeline.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: !Sub "${ProjectName}-codepipeline"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ArtifactBucket
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:GetBucketVersioning
                  - s3:GetBucketLocation
                Resource:
                  - !Ref ArtifactBucketArn
                  - !Sub "${ArtifactBucketArn}/*"
              - Sid: UseGithubConnection
                Effect: Allow
                Action: codestar-connections:UseConnection
                Resource: !Ref ConnectionArn
              - Sid: RunCodeBuild
                Effect: Allow
                Action:
                  - codebuild:StartBuild
                  - codebuild:BatchGetBuilds
                Resource: !Ref CodeBuildProjectArn
              - Sid: EcsDeploy
                Effect: Allow
                # 実機検証の結果、AWS公式ドキュメントが示す6アクション（Describe
                # Services/DescribeTaskDefinition/DescribeTasks/ListTasks/
                # RegisterTaskDefinition/UpdateService）だけではDeployステージが
                # 毎回 "PermissionError: The provided role does not have
                # sufficient permissions to access ECS" で即失敗した。
                # iam:simulate-principal-policyでこの6アクション全てが
                # "allowed"と評価される状態でも失敗が再現したため、IAM上の
                # 実効権限の問題ではなく、CodePipelineのECSデプロイアクションが
                # 実行前に行う権限チェック自体がecs:*ワイルドカードの存在を
                # 要求している（個別列挙では通らない）と判断。DescribeClusters
                # 単体追加、さらにTagResource/UntagResource等を束ねて追加しても
                # 解決せず、ecs:*のみが機能したことで確認済み（2026-08-22実機
                # テスト）。本来の最小権限原則からは外れるが、この一点は
                # CodePipeline側の仕様/挙動によるものとして受け入れる
                Action: "ecs:*"
                Resource: "*"
              - Sid: PassEcsTaskRoles
                Effect: Allow
                # RegisterTaskDefinitionで新しいリビジョンに引き継がせるロールを
                # 「渡す」ための権限。当初はPhase 5の2ロールのARNで厳密に絞って
                # いたが、CodePipelineのECSデプロイアクションが起動前に行う権限
                # チェックがARN限定のPassRoleを正しく認識せず失敗したため、AWS
                # 公式ドキュメントのECSデプロイアクション用ポリシー例に合わせ、
                # Resource="*"+iam:PassedToServiceのCondition（ecs-tasks.amazonaws.com
                # へのPassRoleのみ許可）に変更——実質的な絞り込みはConditionが担う
                Action: iam:PassRole
                Resource: "*"
                Condition:
                  StringEqualsIfExists:
                    "iam:PassedToService": ecs-tasks.amazonaws.com
      Tags:
        - Key: Project
          Value: !Ref ProjectName

  Pipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      Name: !Ref ProjectName
      RoleArn: !GetAtt CodePipelineRole.Arn
      PipelineType: V2
      ArtifactStore:
        Type: S3
        Location: !Ref ArtifactBucketName
      Stages:
        - Name: Source
          Actions:
            - Name: Source
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: CodeStarSourceConnection
                Version: "1"
              OutputArtifacts:
                - Name: source_output
              Configuration:
                ConnectionArn: !Ref ConnectionArn
                FullRepositoryId: !Sub "${GithubOwner}/${GithubRepo}"
                BranchName: !Ref GithubBranch
        - Name: Build
          Actions:
            - Name: Build
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: "1"
              InputArtifacts:
                - Name: source_output
              OutputArtifacts:
                - Name: build_output
              Configuration:
                ProjectName: !Ref CodeBuildProjectName
        - Name: Approve
          Actions:
            - Name: ManualApproval
              ActionTypeId:
                Category: Approval
                Owner: AWS
                Provider: Manual
                Version: "1"
              Configuration:
                CustomData: "Review the new image pushed to ECR, then approve to deploy it to the Phase 5 ECS service."
        - Name: Deploy
          Actions:
            - Name: Deploy
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Provider: ECS
                Version: "1"
              InputArtifacts:
                - Name: build_output
              Configuration:
                ClusterName: !Ref Phase5ProjectName
                ServiceName: !Ref Phase5ProjectName
                FileName: imagedefinitions.json
      Tags:
        - Key: Project
          Value: !Ref ProjectName

Outputs:
  PipelineName:
    Value: !Ref Pipeline
