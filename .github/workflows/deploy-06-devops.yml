name: Portfolio 06 - CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'aws-portfolio-06-devops/infrastructure/**'
  pull_request:
    branches: [main]
    paths:
      - 'aws-portfolio-06-devops/infrastructure/**'
  workflow_dispatch:

defaults:
  run:
    working-directory: aws-portfolio-06-devops

# Phase 06のCodePipeline/CodeBuild/CodeConnectionsは、OIDCデプロイロールに
# 意図的にこれらのサービスの作成権限を持たせていないため、実デプロイは
# ローカルからterraform applyで行う。このワークフローはCloudFormation
# 参照テンプレートの構文検証のみ行う
jobs:
  validate:
    name: Validate CloudFormation Templates
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-1

      - name: Validate codeconnections.yaml
        run: |
          aws cloudformation validate-template \
            --template-body file://infrastructure/cloudformation/codeconnections.yaml

      - name: Validate s3-artifacts.yaml
        run: |
          aws cloudformation validate-template \
            --template-body file://infrastructure/cloudformation/s3-artifacts.yaml

      - name: Validate codebuild.yaml
        run: |
          aws cloudformation validate-template \
            --template-body file://infrastructure/cloudformation/codebuild.yaml

      - name: Validate codepipeline.yaml
        run: |
          aws cloudformation validate-template \
            --template-body file://infrastructure/cloudformation/codepipeline.yaml
